name: {{name}}
publish_to: none

environment:
  sdk: ^3.12.2

dev_dependencies:
  melos: ^7.8.2
  flutter_lints: ^6.0.0

workspace:
  - apps/*
  - features/*
  - packages/*

melos:
  ide:
    intellij:
      enabled: false
  command:
    bootstrap:
      environment:
        sdk: ^3.12.2
        flutter: ">=1.17.0"
      dependencies:
        get_it: ^9.2.1
        injectable: ^3.0.0
        bloc: ^9.2.1
        flutter_bloc: ^9.1.1
        go_router: ^17.3.0
        equatable: ^2.0.8
        meta: ^1.18.3
        collection: ^1.19.1
        nested: ^1.0.0
        rxdart: ^0.28.0
        deep_pick: ^1.1.0
        connectivity_plus: ^7.1.1
        flutter_smart_dialog: ^5.1.0
        package_info_plus: ^10.1.0
        flutter_form_builder: ^10.3.0+2
        form_builder_validators: ^11.3.0
        firebase_core: ^4.11.0
        firebase_auth: ^6.5.3
        firebase_storage: ^13.4.3
        firebase_ai: ^3.13.0
        firebase_remote_config: ^6.5.3
        firebase_crashlytics: ^5.2.4
        firebase_database: ^12.4.3
        cloud_firestore: ^6.6.0
      dev_dependencies:
        flutter_lints: ^6.0.0
        melos: ^7.8.2
        build_runner: ^2.15.0
        injectable_generator: ^3.1.0
      hooks:
        pre: echo '🚀 Bootstrapping workspace...'
        post: echo '✅ Bootstrap done.'
    clean:
      hooks:
        pre: echo '🚀 Cleaning workspace...'
        post: |
          melos di:clean
          find . -name 'pubspec.lock' -delete
          find . -name '*.config.dart' -delete
          find . -name 'Podfile.lock' -delete
          echo '✅ Clean done.'

  scripts:
    workspace:list:
      description: List all packages included in the workspace.
      run: dart pub workspace list

    di:generate:
      description: Generate files for dependency injection
      run: melos exec -c 1 --fail-fast -- "dart run build_runner build -d"

    di:clean:
      description: Clean generated files of dependency injection
      run: melos exec -c 1 --fail-fast -- "dart run build_runner clean"

    build:workspace:
      steps:
        - melos clean
        - melos bs
        - melos di:generate